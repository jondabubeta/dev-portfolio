name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7
        with:
          path: dev-portfolio

      - name: Check out test suite
        uses: actions/checkout@v7
        with:
          repository: jondabubeta/dev-portfolio-tests
          ref: main
          path: dev-portfolio-tests
          token: ${{ secrets.DEV_PORTFOLIO_TESTS_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dev-portfolio/package-lock.json
            dev-portfolio-tests/package-lock.json

      - name: Install portfolio dependencies
        working-directory: dev-portfolio
        run: npm ci

      - name: Install test dependencies
        working-directory: dev-portfolio-tests
        run: npm ci

      - name: Run Vitest suite
        working-directory: dev-portfolio-tests
        run: npm test -- --run

      - name: Upload Vitest Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-vitest
          path: dev-portfolio-tests/allure-results/vitest
          if-no-files-found: warn
          retention-days: 14

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7
        with:
          path: dev-portfolio

      - name: Check out test suite
        uses: actions/checkout@v7
        with:
          repository: jondabubeta/dev-portfolio-tests
          ref: main
          path: dev-portfolio-tests
          token: ${{ secrets.DEV_PORTFOLIO_TESTS_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dev-portfolio/package-lock.json
            dev-portfolio-tests/package-lock.json

      - name: Install portfolio dependencies
        working-directory: dev-portfolio
        run: npm ci

      - name: Install test dependencies
        working-directory: dev-portfolio-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dev-portfolio-tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright suite
        working-directory: dev-portfolio-tests
        run: npm run e2e

      - name: Upload Playwright Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-playwright
          path: dev-portfolio-tests/allure-results/playwright
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Combined Allure report
    if: ${{ !cancelled() }}
    needs:
      - vitest
      - playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test suite
        uses: actions/checkout@v7
        with:
          repository: jondabubeta/dev-portfolio-tests
          ref: main
          path: dev-portfolio-tests
          token: ${{ secrets.DEV_PORTFOLIO_TESTS_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev-portfolio-tests/package-lock.json

      - name: Install report dependencies
        working-directory: dev-portfolio-tests
        run: npm ci

      - name: Download Vitest Allure results
        uses: actions/download-artifact@v5
        with:
          name: allure-results-vitest
          path: dev-portfolio-tests/allure-results/vitest

      - name: Download Playwright Allure results
        uses: actions/download-artifact@v5
        with:
          name: allure-results-playwright
          path: dev-portfolio-tests/allure-results/playwright

      - name: Generate combined Allure report
        working-directory: dev-portfolio-tests
        run: npm run report:generate

      - name: Upload combined Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: dev-portfolio-tests/allure-report
          if-no-files-found: error
          retention-days: 14
