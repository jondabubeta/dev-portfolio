<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume — Jonathan Dabu</title>
    <meta name="description" content="Jonathan Dabu — Software Engineer specializing in Test Automation, Game Systems, and Developer Tools.">
    <link rel="icon" type="image/png" href="/assets/terminal.png">
    <style>
      /* Page-only smooth scrolling (safe for this page) */
      html { scroll-behavior: smooth; }
    </style>
  </head>
  <body>
    <noscript><strong>This page requires JavaScript.</strong></noscript>
    <div id="root"></div>

    <!-- Your React entry -->
    <script type="module" src="/src/pages/ResumeEntry.jsx"></script>

    <!-- Active TOC link highlighting -->
    <script>
      document.querySelectorAll('.toc-link[href^="#"]').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    const id = link.getAttribute('href').slice(1);
    const target = document.getElementById(id);
    if (target) {
      window.scrollTo({
        top: target.getBoundingClientRect().top + window.scrollY - 80, // offset for sticky bar
        behavior: 'smooth'
      });
    }
  });
});
      document.addEventListener("DOMContentLoaded", () => {
        const sections = document.querySelectorAll('.resume-section[id]');
        const links = new Map(
          [...document.querySelectorAll('.toc-link')].map(a => [
            a.getAttribute('href').slice(1), a
          ])
        );

        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              links.forEach(el => el.classList.remove('active'));
              const el = links.get(e.target.id);
              if (el) el.classList.add('active');
              // optional: keep active link visible inside a scrollable .toc-list
              el?.scrollIntoView({ block: 'nearest' });
            }
          });
        }, { rootMargin: '-40% 0px -55% 0px', threshold: 0.01 });

        sections.forEach(s => io.observe(s));
      });
    </script>
  </body>
</html>
